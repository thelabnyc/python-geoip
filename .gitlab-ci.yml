variables:
  FF_NETWORK_PER_BUILD: "true"

stages:
  - download
  - build
  - manifest

.variants:
  py314: &py314
    BASE_IMAGE: "registry.gitlab.com/thelabnyc/python:3.14@sha256:3af90ef5c2425d4348adbc500c67b01f53c8b9bbd686da70fef44f67e5078df0"
    MUTABLE_TAG_NAME: "3.14"
    IMMUTABLE_TAG_NAME: "3.14.${CI_PIPELINE_IID}"
  py315: &py315
    BASE_IMAGE: "registry.gitlab.com/thelabnyc/python:3.15@sha256:c83a8404b09fd7c6313a8c8296442dcae8b89403f9d39d8f8b242103c000f65c"
    MUTABLE_TAG_NAME: "3.15"
    IMMUTABLE_TAG_NAME: "3.15.${CI_PIPELINE_IID}"
  py314_node24: &py314_node24
    BASE_IMAGE: "registry.gitlab.com/thelabnyc/python:3.14-node24@sha256:b568a566dcae1c193abcf447bc065094f03e23c8e98d19f9d2762006898b25b1"
    MUTABLE_TAG_NAME: "3.14-node24"
    IMMUTABLE_TAG_NAME: "3.14.${CI_PIPELINE_IID}-node24"
  py314_node26: &py314_node26
    BASE_IMAGE: "registry.gitlab.com/thelabnyc/python:3.14-node26@sha256:fc3ab09e01f3397ada033ca99c1cce118ffc3bd97b3c136c13bd3b89d92d9fb9"
    MUTABLE_TAG_NAME: "3.14-node26"
    IMMUTABLE_TAG_NAME: "3.14.${CI_PIPELINE_IID}-node26"
  py315_node24: &py315_node24
    BASE_IMAGE: "registry.gitlab.com/thelabnyc/python:3.15-node24@sha256:b3299cb48ea0617dde7398194ee13e6cf49b80d258553e4c5f1a89863c850bb6"
    MUTABLE_TAG_NAME: "3.15-node24"
    IMMUTABLE_TAG_NAME: "3.15.${CI_PIPELINE_IID}-node24"
  py315_node26: &py315_node26
    BASE_IMAGE: "registry.gitlab.com/thelabnyc/python:3.15-node26@sha256:c1403a2110c0bbd38ce6d7819814f2d521b6784de7bb143da0d031cd04418c53"
    MUTABLE_TAG_NAME: "3.15-node26"
    IMMUTABLE_TAG_NAME: "3.15.${CI_PIPELINE_IID}-node26"

.base_job: &base_job
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        TAG_SUFFIX: "-mr${CI_MERGE_REQUEST_IID}"
    # No suffix for default branch
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"
      variables:
        TAG_SUFFIX: ""

download_db:
  <<: *base_job
  stage: download
  image: ubuntu:latest@sha256:2260313b31c8c011cd2eebe728008efac1b3982be73eb71348ea2648d2c0e09b
  tags:
    - thelab-arm64
  script:
    - apt-get update
    - apt-get install -y wget
    - mkdir -p ./data
    - wget "https://download.maxmind.com/app/geoip_download?edition_id=GeoLite2-Country&license_key=$MAXMIND_LICENSE_KEY&suffix=tar.gz" -O "data/GeoLite2-Country.mmdb.tar.gz"
    - wget "https://download.maxmind.com/app/geoip_download?edition_id=GeoLite2-City&license_key=$MAXMIND_LICENSE_KEY&suffix=tar.gz" -O "data/GeoLite2-City.mmdb.tar.gz"
  artifacts:
    paths:
      - data/*

build:
  <<: *base_job
  stage: build
  needs:
    - job: download_db
      artifacts: true
  tags:
    - $RUNNER_TAG
  script:
    - docker login -u "${CI_REGISTRY_USER}" -p "${CI_JOB_TOKEN}" "${CI_REGISTRY}"
    - ./bin/build.sh
  parallel:
    matrix:
      - <<: *py314
        ARCH: amd64
        RUNNER_TAG: thelab-amd64
      - <<: *py314
        ARCH: arm64
        RUNNER_TAG: thelab-arm64
      - <<: *py315
        ARCH: amd64
        RUNNER_TAG: thelab-amd64
      - <<: *py315
        ARCH: arm64
        RUNNER_TAG: thelab-arm64
      - <<: *py314_node24
        ARCH: amd64
        RUNNER_TAG: thelab-amd64
      - <<: *py314_node24
        ARCH: arm64
        RUNNER_TAG: thelab-arm64
      - <<: *py314_node26
        ARCH: amd64
        RUNNER_TAG: thelab-amd64
      - <<: *py314_node26
        ARCH: arm64
        RUNNER_TAG: thelab-arm64
      - <<: *py315_node24
        ARCH: amd64
        RUNNER_TAG: thelab-amd64
      - <<: *py315_node24
        ARCH: arm64
        RUNNER_TAG: thelab-arm64
      - <<: *py315_node26
        ARCH: amd64
        RUNNER_TAG: thelab-amd64
      - <<: *py315_node26
        ARCH: arm64
        RUNNER_TAG: thelab-arm64

manifest:
  stage: manifest
  needs: [build]
  tags:
    - thelab-arm64
  image: docker:latest@sha256:12e683a161823b2a839aeea999b9d960e6e1f9a97b1679ad6b441982e2d9cf07
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"
  script:
    - apk add bash
    - docker login -u "${CI_REGISTRY_USER}" -p "${CI_JOB_TOKEN}" "${CI_REGISTRY}"
    - ./bin/push-manifest.sh
  parallel:
    matrix:
      - <<: *py314
      - <<: *py315
      - <<: *py314_node24
      - <<: *py314_node26
      - <<: *py315_node24
      - <<: *py315_node26
