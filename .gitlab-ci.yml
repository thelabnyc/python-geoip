variables:
  FF_NETWORK_PER_BUILD: "true"

stages:
  - download
  - build
  - manifest

.variants:
  py314: &py314
    BASE_IMAGE: "registry.gitlab.com/thelabnyc/python:3.14@sha256:1ba92055981a8cfce82f3a03a79dab429fc7010a57bc6fb3a197e9c98e7d2b60"
    MUTABLE_TAG_NAME: "3.14"
    IMMUTABLE_TAG_NAME: "3.14.${CI_PIPELINE_IID}"
  py315: &py315
    BASE_IMAGE: "registry.gitlab.com/thelabnyc/python:3.15@sha256:e8f93efa6a89cacc9dbe9cfff0cb0b7e0b596c5aeec9b23fedb5798b2e40a1fc"
    MUTABLE_TAG_NAME: "3.15"
    IMMUTABLE_TAG_NAME: "3.15.${CI_PIPELINE_IID}"
  py314_node24: &py314_node24
    BASE_IMAGE: "registry.gitlab.com/thelabnyc/python:3.14-node24@sha256:2364f0bedc17485f21e02882ebb0b92a04f6ccb73641a21fea057d163314dcf8"
    MUTABLE_TAG_NAME: "3.14-node24"
    IMMUTABLE_TAG_NAME: "3.14.${CI_PIPELINE_IID}-node24"
  py314_node26: &py314_node26
    BASE_IMAGE: "registry.gitlab.com/thelabnyc/python:3.14-node26@sha256:cdc17758e11a770c85efd4c4d2904fe2dc7b83e73341951110140ba01c597b62"
    MUTABLE_TAG_NAME: "3.14-node26"
    IMMUTABLE_TAG_NAME: "3.14.${CI_PIPELINE_IID}-node26"
  py315_node24: &py315_node24
    BASE_IMAGE: "registry.gitlab.com/thelabnyc/python:3.15-node24@sha256:cacefbd4743c4dc35c0a57b92341009af4129892898faf4a04008b2628d74bf8"
    MUTABLE_TAG_NAME: "3.15-node24"
    IMMUTABLE_TAG_NAME: "3.15.${CI_PIPELINE_IID}-node24"
  py315_node26: &py315_node26
    BASE_IMAGE: "registry.gitlab.com/thelabnyc/python:3.15-node26@sha256:aa24b38eb7d9503b12e84fa649430dcb94f3a839ee7a70f6ca9da4bad5677c5f"
    MUTABLE_TAG_NAME: "3.15-node26"
    IMMUTABLE_TAG_NAME: "3.15.${CI_PIPELINE_IID}-node26"

.base_job: &base_job
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        TAG_SUFFIX: "-mr${CI_MERGE_REQUEST_IID}"
    # No suffix for default branch
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"
      variables:
        TAG_SUFFIX: ""

download_db:
  <<: *base_job
  stage: download
  image: ubuntu:latest@sha256:2260313b31c8c011cd2eebe728008efac1b3982be73eb71348ea2648d2c0e09b
  tags:
    - thelab-arm64
  script:
    - apt-get update
    - apt-get install -y wget
    - mkdir -p ./data
    - wget "https://download.maxmind.com/app/geoip_download?edition_id=GeoLite2-Country&license_key=$MAXMIND_LICENSE_KEY&suffix=tar.gz" -O "data/GeoLite2-Country.mmdb.tar.gz"
    - wget "https://download.maxmind.com/app/geoip_download?edition_id=GeoLite2-City&license_key=$MAXMIND_LICENSE_KEY&suffix=tar.gz" -O "data/GeoLite2-City.mmdb.tar.gz"
  artifacts:
    paths:
      - data/*

build:
  <<: *base_job
  stage: build
  needs:
    - job: download_db
      artifacts: true
  tags:
    - $RUNNER_TAG
  script:
    - docker login -u "${CI_REGISTRY_USER}" -p "${CI_JOB_TOKEN}" "${CI_REGISTRY}"
    - ./bin/build.sh
  parallel:
    matrix:
      - <<: *py314
        ARCH: amd64
        RUNNER_TAG: thelab-amd64
      - <<: *py314
        ARCH: arm64
        RUNNER_TAG: thelab-arm64
      - <<: *py315
        ARCH: amd64
        RUNNER_TAG: thelab-amd64
      - <<: *py315
        ARCH: arm64
        RUNNER_TAG: thelab-arm64
      - <<: *py314_node24
        ARCH: amd64
        RUNNER_TAG: thelab-amd64
      - <<: *py314_node24
        ARCH: arm64
        RUNNER_TAG: thelab-arm64
      - <<: *py314_node26
        ARCH: amd64
        RUNNER_TAG: thelab-amd64
      - <<: *py314_node26
        ARCH: arm64
        RUNNER_TAG: thelab-arm64
      - <<: *py315_node24
        ARCH: amd64
        RUNNER_TAG: thelab-amd64
      - <<: *py315_node24
        ARCH: arm64
        RUNNER_TAG: thelab-arm64
      - <<: *py315_node26
        ARCH: amd64
        RUNNER_TAG: thelab-amd64
      - <<: *py315_node26
        ARCH: arm64
        RUNNER_TAG: thelab-arm64

manifest:
  stage: manifest
  needs: [build]
  tags:
    - thelab-arm64
  image: docker:latest@sha256:12e683a161823b2a839aeea999b9d960e6e1f9a97b1679ad6b441982e2d9cf07
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"
  script:
    - apk add bash
    - docker login -u "${CI_REGISTRY_USER}" -p "${CI_JOB_TOKEN}" "${CI_REGISTRY}"
    - ./bin/push-manifest.sh
  parallel:
    matrix:
      - <<: *py314
      - <<: *py315
      - <<: *py314_node24
      - <<: *py314_node26
      - <<: *py315_node24
      - <<: *py315_node26
