variables:
  FF_NETWORK_PER_BUILD: "true"

stages:
  - download
  - build
  - manifest

.variants:
  py314: &py314
    BASE_IMAGE: "registry.gitlab.com/thelabnyc/python:3.14@sha256:bfda42f926eeedea6894bfcf864c5d6d027fef8fa0b59a5d74972e60c5b68609"
    MUTABLE_TAG_NAME: "3.14"
    IMMUTABLE_TAG_NAME: "3.14.${CI_PIPELINE_IID}"
  py315: &py315
    BASE_IMAGE: "registry.gitlab.com/thelabnyc/python:3.15@sha256:5b1ae39e6c5d091331ff25e6c95de2b3d2531018efaec523b45ce5ae2de2c88c"
    MUTABLE_TAG_NAME: "3.15"
    IMMUTABLE_TAG_NAME: "3.15.${CI_PIPELINE_IID}"
  py314_node24: &py314_node24
    BASE_IMAGE: "registry.gitlab.com/thelabnyc/python:3.14-node24@sha256:91dd59f11713c6e8801a5fd4ff92c8b7591707456dcbfd456926a79fe53c1863"
    MUTABLE_TAG_NAME: "3.14-node24"
    IMMUTABLE_TAG_NAME: "3.14.${CI_PIPELINE_IID}-node24"
  py314_node26: &py314_node26
    BASE_IMAGE: "registry.gitlab.com/thelabnyc/python:3.14-node26@sha256:4265bba03cac546a553787f0913fd25252de389666549d5c6ed5f306f6ec6d96"
    MUTABLE_TAG_NAME: "3.14-node26"
    IMMUTABLE_TAG_NAME: "3.14.${CI_PIPELINE_IID}-node26"
  py315_node24: &py315_node24
    BASE_IMAGE: "registry.gitlab.com/thelabnyc/python:3.15-node24@sha256:25dcbbe40c5e451272fe8c5246019de04ccdf706403e5bb32325e2f98b066ee0"
    MUTABLE_TAG_NAME: "3.15-node24"
    IMMUTABLE_TAG_NAME: "3.15.${CI_PIPELINE_IID}-node24"
  py315_node26: &py315_node26
    BASE_IMAGE: "registry.gitlab.com/thelabnyc/python:3.15-node26@sha256:bec6a068ec71ebdadccf15d58530a299f10f21f75bf2051a8176316c385453d6"
    MUTABLE_TAG_NAME: "3.15-node26"
    IMMUTABLE_TAG_NAME: "3.15.${CI_PIPELINE_IID}-node26"

.base_job: &base_job
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        TAG_SUFFIX: "-mr${CI_MERGE_REQUEST_IID}"
    # No suffix for default branch
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"
      variables:
        TAG_SUFFIX: ""

download_db:
  <<: *base_job
  stage: download
  image: ubuntu:latest@sha256:2260313b31c8c011cd2eebe728008efac1b3982be73eb71348ea2648d2c0e09b
  tags:
    - thelab-arm64
  script:
    - apt-get update
    - apt-get install -y wget
    - mkdir -p ./data
    - wget "https://download.maxmind.com/app/geoip_download?edition_id=GeoLite2-Country&license_key=$MAXMIND_LICENSE_KEY&suffix=tar.gz" -O "data/GeoLite2-Country.mmdb.tar.gz"
    - wget "https://download.maxmind.com/app/geoip_download?edition_id=GeoLite2-City&license_key=$MAXMIND_LICENSE_KEY&suffix=tar.gz" -O "data/GeoLite2-City.mmdb.tar.gz"
  artifacts:
    paths:
      - data/*

build:
  <<: *base_job
  stage: build
  needs:
    - job: download_db
      artifacts: true
  tags:
    - $RUNNER_TAG
  script:
    - docker login -u "${CI_REGISTRY_USER}" -p "${CI_JOB_TOKEN}" "${CI_REGISTRY}"
    - ./bin/build.sh
  parallel:
    matrix:
      - <<: *py314
        ARCH: amd64
        RUNNER_TAG: thelab-amd64
      - <<: *py314
        ARCH: arm64
        RUNNER_TAG: thelab-arm64
      - <<: *py315
        ARCH: amd64
        RUNNER_TAG: thelab-amd64
      - <<: *py315
        ARCH: arm64
        RUNNER_TAG: thelab-arm64
      - <<: *py314_node24
        ARCH: amd64
        RUNNER_TAG: thelab-amd64
      - <<: *py314_node24
        ARCH: arm64
        RUNNER_TAG: thelab-arm64
      - <<: *py314_node26
        ARCH: amd64
        RUNNER_TAG: thelab-amd64
      - <<: *py314_node26
        ARCH: arm64
        RUNNER_TAG: thelab-arm64
      - <<: *py315_node24
        ARCH: amd64
        RUNNER_TAG: thelab-amd64
      - <<: *py315_node24
        ARCH: arm64
        RUNNER_TAG: thelab-arm64
      - <<: *py315_node26
        ARCH: amd64
        RUNNER_TAG: thelab-amd64
      - <<: *py315_node26
        ARCH: arm64
        RUNNER_TAG: thelab-arm64

manifest:
  stage: manifest
  needs: [build]
  tags:
    - thelab-arm64
  image: docker:latest@sha256:12e683a161823b2a839aeea999b9d960e6e1f9a97b1679ad6b441982e2d9cf07
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"
  script:
    - apk add bash
    - docker login -u "${CI_REGISTRY_USER}" -p "${CI_JOB_TOKEN}" "${CI_REGISTRY}"
    - ./bin/push-manifest.sh
  parallel:
    matrix:
      - <<: *py314
      - <<: *py315
      - <<: *py314_node24
      - <<: *py314_node26
      - <<: *py315_node24
      - <<: *py315_node26
