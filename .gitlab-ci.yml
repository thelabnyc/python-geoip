variables:
  FF_NETWORK_PER_BUILD: "true"

stages:
  - download
  - build
  - manifest

.variants:
  py314: &py314
    BASE_IMAGE: "registry.gitlab.com/thelabnyc/python:3.14@sha256:c721410b4ce1c0aa54ed5a9d8bce22d5015ff8fa678ae114ae7571078e3a62e5"
    MUTABLE_TAG_NAME: "3.14"
    IMMUTABLE_TAG_NAME: "3.14.${CI_PIPELINE_IID}"
  py315: &py315
    BASE_IMAGE: "registry.gitlab.com/thelabnyc/python:3.15@sha256:a04134afa4cc0bbde93cf357c2a1ffc8683590054a5cf99e1fa3eb929bb4aaa5"
    MUTABLE_TAG_NAME: "3.15"
    IMMUTABLE_TAG_NAME: "3.15.${CI_PIPELINE_IID}"
  py314_node24: &py314_node24
    BASE_IMAGE: "registry.gitlab.com/thelabnyc/python:3.14-node24@sha256:d5326c9b1eccacf2967df286d0be8548d39a5d0abb9d4660926be682e9ef51aa"
    MUTABLE_TAG_NAME: "3.14-node24"
    IMMUTABLE_TAG_NAME: "3.14.${CI_PIPELINE_IID}-node24"
  py314_node26: &py314_node26
    BASE_IMAGE: "registry.gitlab.com/thelabnyc/python:3.14-node26@sha256:a87c903046c3ce31f30694021a596761f74cc7f04b3aa4ce62fd9a521c130bd6"
    MUTABLE_TAG_NAME: "3.14-node26"
    IMMUTABLE_TAG_NAME: "3.14.${CI_PIPELINE_IID}-node26"
  py315_node24: &py315_node24
    BASE_IMAGE: "registry.gitlab.com/thelabnyc/python:3.15-node24@sha256:ce5d8621766cd15cbfcea536e25ca8e494bb5bc3097e46f06b4a988172dafda0"
    MUTABLE_TAG_NAME: "3.15-node24"
    IMMUTABLE_TAG_NAME: "3.15.${CI_PIPELINE_IID}-node24"
  py315_node26: &py315_node26
    BASE_IMAGE: "registry.gitlab.com/thelabnyc/python:3.15-node26@sha256:911d697b6da86ab6ad8edf6f4d34a447a763741f217d5e1ef0fd39ad32b1efcb"
    MUTABLE_TAG_NAME: "3.15-node26"
    IMMUTABLE_TAG_NAME: "3.15.${CI_PIPELINE_IID}-node26"

.base_job: &base_job
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        TAG_SUFFIX: "-mr${CI_MERGE_REQUEST_IID}"
    # No suffix for default branch
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"
      variables:
        TAG_SUFFIX: ""

download_db:
  <<: *base_job
  stage: download
  image: ubuntu:latest@sha256:2260313b31c8c011cd2eebe728008efac1b3982be73eb71348ea2648d2c0e09b
  tags:
    - thelab-arm64
  script:
    - apt-get update
    - apt-get install -y wget
    - mkdir -p ./data
    - wget "https://download.maxmind.com/app/geoip_download?edition_id=GeoLite2-Country&license_key=$MAXMIND_LICENSE_KEY&suffix=tar.gz" -O "data/GeoLite2-Country.mmdb.tar.gz"
    - wget "https://download.maxmind.com/app/geoip_download?edition_id=GeoLite2-City&license_key=$MAXMIND_LICENSE_KEY&suffix=tar.gz" -O "data/GeoLite2-City.mmdb.tar.gz"
  artifacts:
    paths:
      - data/*

build:
  <<: *base_job
  stage: build
  needs:
    - job: download_db
      artifacts: true
  tags:
    - $RUNNER_TAG
  script:
    - docker login -u "${CI_REGISTRY_USER}" -p "${CI_JOB_TOKEN}" "${CI_REGISTRY}"
    - ./bin/build.sh
  parallel:
    matrix:
      - <<: *py314
        ARCH: amd64
        RUNNER_TAG: thelab-amd64
      - <<: *py314
        ARCH: arm64
        RUNNER_TAG: thelab-arm64
      - <<: *py315
        ARCH: amd64
        RUNNER_TAG: thelab-amd64
      - <<: *py315
        ARCH: arm64
        RUNNER_TAG: thelab-arm64
      - <<: *py314_node24
        ARCH: amd64
        RUNNER_TAG: thelab-amd64
      - <<: *py314_node24
        ARCH: arm64
        RUNNER_TAG: thelab-arm64
      - <<: *py314_node26
        ARCH: amd64
        RUNNER_TAG: thelab-amd64
      - <<: *py314_node26
        ARCH: arm64
        RUNNER_TAG: thelab-arm64
      - <<: *py315_node24
        ARCH: amd64
        RUNNER_TAG: thelab-amd64
      - <<: *py315_node24
        ARCH: arm64
        RUNNER_TAG: thelab-arm64
      - <<: *py315_node26
        ARCH: amd64
        RUNNER_TAG: thelab-amd64
      - <<: *py315_node26
        ARCH: arm64
        RUNNER_TAG: thelab-arm64

manifest:
  stage: manifest
  needs: [build]
  tags:
    - thelab-arm64
  image: docker:latest@sha256:12e683a161823b2a839aeea999b9d960e6e1f9a97b1679ad6b441982e2d9cf07
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"
  script:
    - apk add bash
    - docker login -u "${CI_REGISTRY_USER}" -p "${CI_JOB_TOKEN}" "${CI_REGISTRY}"
    - ./bin/push-manifest.sh
  parallel:
    matrix:
      - <<: *py314
      - <<: *py315
      - <<: *py314_node24
      - <<: *py314_node26
      - <<: *py315_node24
      - <<: *py315_node26
